name: Publish release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: .\build.ps1 -Configuration Release
        shell: powershell
      - name: Test and verify version
        shell: powershell
        run: |
          $exe = '.\dist\Codex-Zh-Launcher-Windows-x64.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru -WindowStyle Hidden -RedirectStandardOutput self-test.out
          if ($process.ExitCode -ne 0) { throw "Self-test failed: $($process.ExitCode)" }
          .\test-shutdown.ps1
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $expected = $version + '.0'
          $actual = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $exe)).FileVersion
          if ($actual -ne $expected) { throw "Tag does not match executable version $actual." }
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { choco install innosetup --no-progress -y }
          .\scripts\build-windows-installer.ps1 -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/Codex-Zh-Launcher-Windows-x64.exe
            dist/Codex-Zh-Launcher-Windows-x64-Setup.exe

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-14
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            asset: Codex-Zh-Launcher-macOS-arm64.zip
            dmg: Codex-Zh-Launcher-macOS-arm64.dmg
          - arch: x86_64
            asset: Codex-Zh-Launcher-macOS-x64.zip
            dmg: Codex-Zh-Launcher-macOS-x64.dmg
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-macos.sh
      - run: CODEX_ZH_SHARED_DIR="$PWD/shared" swift run --package-path macos CodexZhLauncherMac --self-test
      - name: Run CLI diagnostics on host
        run: |
          set +e
          CODEX_ZH_SHARED_DIR="$PWD/shared" swift run --package-path macos CodexZhLauncherMac --diagnostics | tee diagnostics.out
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0 -o "$status" -eq 2
          grep -Eq 'codex=(found|not-found)' diagnostics.out
      - run: RELEASE_VERSION="${GITHUB_REF_NAME#v}" bash scripts/build-macos.sh '${{ matrix.arch }}'
      - name: Run updater integration test on host architecture
        run: bash scripts/test-macos-updater.sh '${{ matrix.arch }}'
      - name: Verify tag version
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(unzip -p "dist/${{ matrix.asset }}" '*/Contents/Info.plist' | plutil -extract CFBundleShortVersionString raw -o - -)"
          test "$actual" = "$expected"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.dmg }}

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum Codex-Zh-Launcher-Windows-x64.exe Codex-Zh-Launcher-Windows-x64-Setup.exe Codex-Zh-Launcher-macOS-arm64.zip Codex-Zh-Launcher-macOS-arm64.dmg Codex-Zh-Launcher-macOS-x64.zip Codex-Zh-Launcher-macOS-x64.dmg > SHA256SUMS.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' release-assets/* --repo '${{ github.repository }}' --title "Codex 汉化增强工具 ${{ github.ref_name }}" --generate-notes --verify-tag
